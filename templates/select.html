<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ピカピカ学園</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid min-vh-100 d-flex flex-column">

  <!-- 上段 -->
  <div class="row align-items-center border-bottom py-2 px-3">
    <div class="col-4">
      <strong>{{ user.name }}</strong><br>
      <span class="badge bg-warning text-dark fs-6">コイン  {{ user.coin }}</span>
      <span class="badge bg-info text-dark fs-6">チケット  {{ user.ticket }}</span>
    </div>

    <div class="col-4 text-center">
      <h4 class="m-0">ピカピカ学園</h4>
    </div>

    <div class="col-4 text-end">
      <a href="/ranking" class="btn btn-outline-secondary">
        🏆 ランキング
      </a>
    </div>
  </div>

  <!-- メイン（横並び） -->
  <div class="row flex-grow-1 px-3 pb-3 align-items-stretch  mt-5">

    <!-- 左：授業 -->
    <div class="col-8 d-flex">
      <div class="w-100 border rounded bg-white d-flex flex-column p-4">
      
        <!-- タイトル -->
        <h3 class="text-center mb-4 mt-2">授業</h3>
      
        <!-- ボタン -->
        <div class="row flex-grow-1 g-3 px-2">
          <div class="col-6 d-flex">
            <a href="/class1"
               class="btn btn-primary w-100 d-flex align-items-center justify-content-center fs-3 fw-bold">
              理系クイズ
            </a>
          </div>
        
          <div class="col-6 d-flex">
            <a href="/class2"
               class="btn btn-primary w-100 d-flex align-items-center justify-content-center fs-3 fw-bold">
              文系クイズ
            </a>
          </div>
        </div>
      
      </div>
    </div>
  
    <!-- 右：ゲーム -->
    <div class="col-4 d-flex">
      <div class="w-100 border rounded bg-white d-flex flex-column p-4">
      
        <!-- タイトル -->
        <h3 class="text-center mb-4 mt-2">ゲーム</h3>
      
        <!-- ボタン -->
        <div class="flex-grow-1 d-flex">
          <a href="/game"
             class="btn btn-danger w-100 d-flex align-items-center justify-content-center fs-3 fw-bold">
            ルーレット
          </a>
        </div>
      
      </div>
    </div>
  
  </div>
  


</div>

</body>
</html>
