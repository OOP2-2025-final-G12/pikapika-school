<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ピカピカ学園</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🌟 ピカピカ学園</h1>
        
        <div class="card">
            <h2>新規ユーザー作成</h2>
            <form method="POST">
                <input type="text" name="name" placeholder="名前を入力" required>
                <button type="submit">作成</button>
            </form>
        </div>

        <div class="card">
            <h2>ユーザー一覧</h2>
            {% if users %}
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>名前</th>
                        <th>コイン</th>
                        <th>チケット</th>
                        <th>作成日時</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user.id }}</td>
                        <td>{{ user.name }}</td>
                        <td>{{ user.coin }}</td>
                        <td>{{ user.ticket }}</td>
                        <td>{{ user.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% else %}
            <p class="empty">まだユーザーがいません</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
