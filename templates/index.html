<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ピカピカ学園</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(
        135deg,
        #2b1055,
        #1b3b8a,
        #3a7bd5
      );
    }
  </style>
</head>

<body>

<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center px-3">

  <!-- メイン枠 -->
  <div class="bg-white rounded-4 shadow-lg p-5 w-100 text-center"
       style="max-width: 1000px;">

    <!-- タイトル -->
    <h1 class="fw-bold mb-3 display-5 text-dark">
      🌌 ピカピカ学園 🌟
    </h1>

    <!-- 説明 -->
    <p class="fs-5 text-secondary mb-4">
      なまえをいれて、<br>
      お勉強を頑張ろう！
    </p>

    <!-- 名前入力フォーム -->
    <form method="POST" class="mb-4 d-flex flex-column align-items-center">

      <input
        type="text"
        name="name"
        class="form-control form-control-lg text-center mb-3"
        placeholder="なまえ"
        maxlength="8"
        style="max-width: 22rem;"
        required
      >

      <button
        type="submit"
        class="btn btn-primary btn-lg px-5 py-3 fs-3 fw-bold rounded-pill shadow">
        ▶ スタート！
      </button>

    </form>


  </div>

</div>

</body>
</html>
