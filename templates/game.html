<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ルーレットゲーム</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<h1>🎰 ルーレットゲーム</h1>

<p>ユーザー：{{ user.name }}</p>
<p>チケット：{{ user.ticket }} 枚</p>
<p>コイン：{{ user.coin }} 枚</p>

<div class="roulette-container">
    <div id="roulette">🎯</div>
</div>

{% if user.ticket > 0 %}
<form action="/game/play" method="post" onsubmit="spin()">
    <button>ルーレットを回す（チケット1枚）</button>
</form>
{% else %}
<p style="color:red;">チケットがありません</p>
{% endif %}

<a href="/select">← セレクト画面に戻る</a>

<script>
function spin() {
    const r = document.getElementById("roulette");
    r.style.animation = "spin 2s ease-out";
}
</script>

</body>
</html>
