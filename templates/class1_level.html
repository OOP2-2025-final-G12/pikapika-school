<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>授業1 - レベル{{ level }} 問題 {{ progress }}/{{ total }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='class1_style.css') }}">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
  <div class="site-title">ピカピカ学園</div>
  <div class="container">
    <header class="site-header">
      <h1>📘 授業1（理系） - レベル{{ level }}</h1>
      <div class="user-info">{{ user.name }} | コイン: {{ user.coin }} | チケット: {{ user.ticket }}</div>
    </header>

    <div class="card">
      <div class="meta"> <span class="q-number">問題 {{ progress }} / {{ total }}</span> </div>
      <p class="question-text">{{ q.q }}</p>

      <form method="POST">
        <div class="choices">
          {% for choice in q.choices %}
          <label class="choice">
            <input type="radio" name="choice" value="{{ loop.index0 }}" required>
            <span>{{ choice }}</span>
          </label>
          {% endfor %}
        </div>

        <div class="controls">
          <button class="btn next-btn" type="submit">次へ</button>
        </div>

        <div class="progress" aria-hidden="true">
          <i style="--progress: {{ progress_percent }};"></i>
        </div>
      </form>
    </div>

    <p style="margin-top:14px;"><a href="/select">← セレクト画面に戻る</a></p>
  </div>
</body>
</html>
