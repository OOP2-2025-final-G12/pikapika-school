<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>授業２（文系）</title>
        <style>
body {
    font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* CSSだけで背景に動きをつける（龍モチーフ） */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
            /* 龍本体を大きくするためにスケールアップ＆位置調整 */
            radial-gradient(ellipse 180% 120% at 10% 25%, rgba(40,40,80,0.38) 0%, transparent 30%),
            radial-gradient(ellipse 160% 110% at 30% 38%, rgba(30,30,70,0.42) 0%, transparent 28%),
            radial-gradient(ellipse 170% 115% at 55% 32%, rgba(25,25,65,0.45) 0%, transparent 25%),
            radial-gradient(ellipse 150% 130% at 75% 42%, rgba(35,35,75,0.40) 0%, transparent 32%),
            radial-gradient(ellipse 140% 100% at 88% 28%, rgba(45,45,85,0.35) 0%, transparent 30%),
            
            /* 頭部強調 */
            radial-gradient(circle 90px at 12% 18%, rgba(15,15,50,0.55) 0%, transparent 50%),
            
            /* 尾強調 */
            radial-gradient(ellipse 200% 140% at 92% 78%, rgba(30,30,70,0.38) 0%, transparent 35%),
            
            /* 墨のタッチ */
            linear-gradient(40deg, transparent 46%, rgba(20,20,60,0.18) 50%, transparent 54%),
            linear-gradient(-50deg, transparent 46%, rgba(20,20,60,0.15) 50%, transparent 54%),
            radial-gradient(circle at 45% 65%, rgba(25,25,65,0.22) 0%, transparent 40%);
        
        background-size: 120% 120%, 110% 110%, 130% 130%, 100% 100%, 140% 140%, 
                        80% 80%, 150% 150%, 200% 200%, 180% 180%, 160% 160%;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.82;
        pointer-events: none;
        z-index: -2;
    }

div {
    text-align: center;
    margin-bottom: 40px;
}

h1 {
    color: #333;
    margin-bottom: 30px;
}

p {
    font-size: 1.1em;
    margin: 10px 0;
}

/* ボタン全体のコンテナ（斜め配置用） */
.level-buttons {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 80px;
    flex-wrap: wrap;
    margin: 60px 0;
    position: relative;
    height: 360px;
}

/* 各ボタンを卵形にする共通スタイル */
.level-button {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
}

.level-button span {
    display: block;
    padding: 35px 60px;
    border-radius: 50% / 60%;
    border: 4px solid #333;
    font-weight: bold;
    font-size: 1.8em;
    color: #333;
    background-color: inherit;
    box-shadow: 6px 6px 12px rgba(0,0,0,0.25);
    transition: transform 0.3s, box-shadow 0.3s;
    min-width: 180px;
}

.level-button span:hover {
    transform: translateY(-10px);
    box-shadow: 10px 10px 20px rgba(0,0,0,0.35);
}

/* 色の名前（小さく下に表示） */
.level-button small {
    margin-top: 15px;
    font-size: 0.95em;
    color: #555;
}

/* 個別の色と斜め配置 */
.level-button:nth-child(1) {  /* レベル１：薄桜 */
    order: 1;
    align-self: flex-end;
}

.level-button:nth-child(1) span {
    background-color: #fdeff2;
}

.level-button:nth-child(2) {  /* レベル２：海松色 */
    order: 2;
}

.level-button:nth-child(2) span {
    background-color: #726d40;
    color: #fff;
}

.level-button:nth-child(3) {  /* レベル３：浅縹 */
    order: 3;
    align-self: flex-start;
}

.level-button:nth-child(3) span {
    background-color: #84b9cb;
}

a[href="/"] {
    margin-top: 40px;
    font-size: 1.2em;
    color: #555;
    text-decoration: none;
}

a[href="/"]:hover {
    text-decoration: underline;
}
    </style>
    </head>

    <body>
        <div>
            <h1>授業２ レベル選択</h1>

            <p>こんにちは、<strong>{{ user.name if user else 'テストユーザー' }}</strong>さん！</p>
            <p>現在のticket: <strong>{{ user.ticket if user else 0 }}</strong>枚</p>

            <div class="level-buttons">
                <a href="{{ url_for('class2.level1') }}" class="level-button">
                <span>レベル１（小学校低学年）</span>
                <small>薄桜</small>
            </a>
            <a href="{{ url_for('class2.level2') }}" class="level-button">
                <span>レベル２（小学校高学年）</span>
                <small>海松色</small>
            </a>
            <a href="{{ url_for('class2.level3') }}" class="level-button">
                <span>レベル３（雑学・中学校）</span>
                <small>浅縹</small>
            </a>
        </div>
        </div>

        <p><a href="/">トップに戻る</a></p>
    </body>
</html>
